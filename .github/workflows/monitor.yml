name: Market Sniper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WIKI_COOKIE: ${{ secrets.WIKI_COOKIE }}
        run: python monitor.py

      - name: Commit cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update cache.json"
          file_pattern: cache.json
