name: Market Sniper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WIKI_ANON_KEY: ${{ secrets.WIKI_ANON_KEY }}
          WIKI_REFRESH_TOKEN: ${{ secrets.WIKI_REFRESH_TOKEN }}
        run: python monitor.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json session.json 2>/dev/null || true
          git commit -m "Update cache & session" || exit 0
          git push
