name: Market Sniper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache.json
            session.json
          key: sniper-cache-${{ github.run_id }}
          restore-keys: |
            sniper-cache-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WIKI_ANON_KEY: ${{ secrets.WIKI_ANON_KEY }}
          WIKI_REFRESH_TOKEN: ${{ secrets.WIKI_REFRESH_TOKEN }}
        run: python monitor.py

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cache.json
            session.json
          key: sniper-cache-${{ github.run_id }}
